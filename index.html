<!DOCTYPE html>
<html>
    <head>
        <title>Todo List</title>
        <link rel="stylesheet" href="./style.css">
    </head>
    <body>
        <div class="header">
            <p class="title">Todo List</p>

            <div class="filters">
                <button class="filter-button js-filter-all">All</button>
                <button class="filter-button js-filter-month" id="monthButton">Month</button>
                <button class="filter-button js-filter-week">This Week</button>
                <button class="filter-button js-filter-today">Today</button>
            </div>

            <div class="right-buttons">
                <button id="notificationButton" class="notification-button js-notification-button">🔔</button>
                <button id="changeTheme" class="changeTheme-button js-changeTheme-button"><img src="./Mr_Bright_2.png" class="ch-pic"></button>
            </div>
        </div>

        <div class="todo-input-grid">
            <input placeholder="New Task" class="js-name-input name-input">
            <input type="datetime-local" class="js-date-input date-input">
            <button class="add-button js-add-button">Add</button>
        </div>
        
        <div class="js-todo-list todo-grid"></div>

        <script src="./script.js"></script>
    </body>
</html>
